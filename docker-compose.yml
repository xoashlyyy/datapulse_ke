services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse
      POSTGRES_DB: datapulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://datapulse:datapulse@db:5432/datapulse
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "python -m src.pipeline && streamlit run app/streamlit_app.py --server.address=0.0.0.0"
    ports: ["8501:8501"]
volumes:
  pgdata:
